<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jungle Gift Basket</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2E7D32}a:hover{color:#1B5E20}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; isolation: isolate; background: linear-gradient(180deg, #E4F4E6 0%, #D3ECD4 100%); color: #1B2B1F; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 72px 20px 28px; gap: 14px;">
  <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.8px; color: #5B6B5F;">LEVEL 40 MILESTONE</span>
  <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 34px; text-align: center;">Jungle Gift Basket!</h1>

  <button aria-label="{{ basketLabel }}" onClick="{{ toggle }}" style="border: 0; background: transparent; padding: 0; cursor: pointer;">
    <svg width="260" height="230" viewBox="0 0 260 230" aria-hidden="true">
      <defs>
        <linearGradient id="gWick" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9A86A"></stop><stop offset="0.55" stop-color="#B07A3E"></stop><stop offset="1" stop-color="#7A4E22"></stop></linearGradient>
        <linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity="0.28"></stop><stop offset="0.25" stop-color="#000" stop-opacity="0"></stop><stop offset="0.75" stop-color="#000" stop-opacity="0"></stop><stop offset="1" stop-color="#000" stop-opacity="0.3"></stop></linearGradient>
        <linearGradient id="gRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0C98E"></stop><stop offset="1" stop-color="#9A6430"></stop></linearGradient>
        <linearGradient id="gHandle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7BC80"></stop><stop offset="1" stop-color="#8C5A2A"></stop></linearGradient>
        <pattern id="gWeave" width="16" height="12" patternUnits="userSpaceOnUse">
          <path d="M0 3 Q4 0 8 3 T16 3 M0 9 Q4 12 8 9 T16 9" fill="none" stroke="#5E3A16" stroke-width="1.2" opacity="0.55"></path>
          <path d="M8 0 V12" stroke="#5E3A16" stroke-width="1" opacity="0.35"></path>
          <path d="M0 4 Q4 1.5 8 4" fill="none" stroke="#FFE2B0" stroke-width="0.8" opacity="0.5"></path>
        </pattern>
        <radialGradient id="gGlow"><stop offset="0" stop-color="#FFF4B0" stop-opacity="0.95"></stop><stop offset="1" stop-color="#FFF4B0" stop-opacity="0"></stop></radialGradient>
        <radialGradient id="gCoin" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFF6C4"></stop><stop offset="0.45" stop-color="#FFC928"></stop><stop offset="1" stop-color="#B57E00"></stop></radialGradient>
        <filter id="gBlur" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="6"></feGaussianBlur></filter>
      </defs>
      <ellipse cx="130" cy="214" rx="92" ry="9" fill="#1B3A12" opacity="0.3" filter="url(#gBlur)"></ellipse>
      <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
        <g>
          <circle cx="130" cy="96" r="96" fill="url(#gGlow)"></circle>
          <g fill="#FFFFFF"><path d="M50 52 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z" opacity="0.9"></path><path d="M212 46 l1.5 4.5 4.5 1.5 -4.5 1.5 -1.5 4.5 -1.5 -4.5 -4.5 -1.5 4.5 -1.5 z" opacity="0.85"></path></g>
        </g>
      </sc-if>
      <path d="M62 114 Q 130 14 198 114" fill="none" stroke="#5E3A16" stroke-width="13" stroke-linecap="round"></path>
      <path d="M62 114 Q 130 14 198 114" fill="none" stroke="url(#gHandle)" stroke-width="10" stroke-linecap="round"></path>
      <path d="M62 114 Q 130 14 198 114" fill="none" stroke="#5E3A16" stroke-width="10" stroke-dasharray="2 7" opacity="0.4"></path>
      <path d="M52 112 C 70 74, 190 74, 208 112 Z" fill="#7A4E22" opacity="0.35"></path>
      <path d="M50 108 C 64 90, 84 86, 92 98 C 100 80, 124 72, 140 86 C 152 76, 176 82, 182 98 C 194 92, 206 98, 210 108 Z" fill="#3E7A2A"></path>
      <path d="M56 96 C 48 80, 64 72, 78 90 C 70 94, 62 96, 56 96 Z M206 94 C 216 78, 200 70, 186 88 C 194 92, 200 94, 206 94 Z M110 84 C 104 66, 120 60, 128 78 Z" fill="#66BB6A"></path>
      <sc-for list="{{ pile }}" as="c" hint-placeholder-count="11">
        <g transform="{{ c.t }}">
          <ellipse cx="0" cy="2.4" rx="14" ry="{{ c.ry }}" fill="#8D6200"></ellipse>
          <ellipse rx="14" ry="{{ c.ry }}" fill="url(#gCoin)" stroke="#8D6200" stroke-width="1"></ellipse>
          <ellipse rx="9.5" ry="{{ c.ry2 }}" fill="none" stroke="#B88A00" stroke-width="1" opacity="0.7"></ellipse>
        </g>
      </sc-for>
      <g transform="translate(150 80) rotate(-12)">
        <circle r="16" fill="#FFF59D" opacity="0.7"></circle>
        <ellipse cx="-6" cy="-5" rx="6" ry="3.5" transform="rotate(-30 -6 -5)" fill="#FFFFFF" opacity="0.9" stroke="#90A4AE" stroke-width="0.6"></ellipse>
        <ellipse cx="6" cy="-5" rx="6" ry="3.5" transform="rotate(30 6 -5)" fill="#FFFFFF" opacity="0.9" stroke="#90A4AE" stroke-width="0.6"></ellipse>
        <ellipse cx="0" cy="3" rx="5" ry="7" fill="#FFEE58" stroke="#C17900" stroke-width="0.8"></ellipse>
        <circle cx="0" cy="-6" r="3.4" fill="#4E342E"></circle>
      </g>
      <g><circle cx="66" cy="102" r="7" fill="#C62828"></circle><circle cx="64" cy="100" r="2" fill="#FF8A80"></circle><circle cx="76" cy="106" r="6" fill="#D32F2F"></circle><circle cx="196" cy="102" r="7" fill="#C62828"></circle><circle cx="194" cy="100" r="2" fill="#FF8A80"></circle></g>
      <path d="M44 116 H216 L199 200 Q 130 212 61 200 Z" fill="url(#gWick)"></path>
      <path d="M44 116 H216 L199 200 Q 130 212 61 200 Z" fill="url(#gWeave)"></path>
      <path d="M44 116 H216 L199 200 Q 130 212 61 200 Z" fill="url(#gSide)"></path>
      <path d="M58 182 Q 130 190 202 182" fill="none" stroke="#5E3A16" stroke-width="5" opacity="0.35"></path>
      <rect x="36" y="104" width="188" height="20" rx="10" fill="url(#gRim)"></rect>
      <rect x="36" y="104" width="188" height="20" rx="10" fill="url(#gWeave)" opacity="0.7"></rect>
      <path d="M46 108 H214" stroke="#FFF1D2" stroke-width="2" stroke-linecap="round" opacity="0.7"></path>
      <path d="M44 106 C 32 90, 46 80, 64 96 C 56 100, 50 104, 44 106 Z" fill="#5DAA4A"></path>
      <path d="M216 106 C 228 90, 214 80, 196 96 C 204 100, 210 104, 216 106 Z" fill="#7CC15E"></path>
      <g transform="translate(130 116)">
        <path d="M0 0 C -6 -10, -22 -12, -22 -2 C -22 6, -8 4, 0 0 Z M0 0 C 6 -10, 22 -12, 22 -2 C 22 6, 8 4, 0 0 Z" fill="#D32F2F"></path>
        <path d="M0 0 L -8 16 M0 0 L 8 16" stroke="#B71C1C" stroke-width="5" stroke-linecap="round"></path>
        <path d="M-18 -4 C -14 -8, -8 -6, -4 -2 M18 -4 C 14 -8, 8 -6, 4 -2" fill="none" stroke="#FF8A80" stroke-width="1.6" stroke-linecap="round" opacity="0.8"></path>
        <circle r="5.5" fill="#E53935"></circle>
      </g>
    </svg>
  </button>
  <span style="font-size: 15px; font-weight: 800; color: #5B6B5F;">{{ hint }}</span>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
    <div style="align-self: stretch; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div style="border-radius: 20px; background: #FFFBF2; box-shadow: inset 0 1px 0 #FFFFFF, 0 3px 0 rgba(150,130,90,0.3), 0 12px 26px rgba(30,60,30,0.16); padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><defs><radialGradient id="gC2" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFF6C4"></stop><stop offset="0.45" stop-color="#FFC928"></stop><stop offset="1" stop-color="#B57E00"></stop></radialGradient></defs><circle cx="12" cy="12" r="10.2" fill="url(#gC2)" stroke="#8D6200" stroke-width="1"></circle><path d="M8.6 14.6 C 9 9.6, 13.4 7.6, 15.9 8.1 C 15.4 12.6, 12 15.1, 8.6 14.6 Z" fill="#FFE38A" stroke="#9A6B00" stroke-width="0.9"></path></svg>
        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums;">+150</span>
        <span style="font-size: 13px; font-weight: 800; color: #5B6B5F;">coins</span>
      </div>
      <div style="border-radius: 20px; background: #FFFBF2; box-shadow: inset 0 1px 0 #FFFFFF, 0 3px 0 rgba(150,130,90,0.3), 0 12px 26px rgba(30,60,30,0.16); padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <dc-import name="Booster" kind="hint" size="{{ 44 }}" hint-size="44px,44px"></dc-import>
        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px;">+1</span>
        <span style="font-size: 13px; font-weight: 800; color: #5B6B5F;">Glow Firefly Hint</span>
      </div>
    </div>
  </sc-if>

  <a href="Play.dc.html" style="margin-top: auto; align-self: stretch; height: 60px; border-radius: 30px; background: linear-gradient(180deg, #A6E585 0%, #4CAF50 48%, #2E7D32 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,0.42), inset 0 -3px 0 rgba(0,0,0,0.14), 0 5px 0 #1B5E20, 0 12px 20px rgba(27,94,32,0.3); display: flex; align-items: center; justify-content: center; text-decoration: none; color: #FFFFFF; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 21px;">Collect</a>
  <span style="font-size: 12px; font-weight: 700; color: #5B6B5F; text-align: center;">Next up: Level 41 · NEW! Bamboo Cage &amp; Key</span>
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; pointer-events: none;"><dc-import name="Backdrop" hint-size="390px,844px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: true }; }
  renderVals() {
    const open = this.state.open;
    const raw = [
      [72, 106, 0, 6], [96, 104, -6, 7], [122, 106, 4, 6], [148, 104, -4, 7], [176, 106, 6, 6], [196, 108, 0, 5],
      [86, 94, -10, 8], [112, 92, 8, 9], [178, 94, 14, 8], [102, 78, -24, 14], [126, 74, 10, 14]
    ];
    const pile = raw.map((c) => ({ t: 'translate(' + c[0] + ' ' + c[1] + ') rotate(' + c[2] + ')', ry: c[3], ry2: +(c[3] * 0.68).toFixed(1) }));
    return {
      open, pile, toggle: () => this.setState({ open: !open }),
      hint: open ? 'Opened! Your rewards fly to the wallet.' : 'Tap the basket to open',
      basketLabel: open ? 'Gift basket, opened' : 'Gift basket, tap to open'
    };
  }
}
</script>
</body>
</html>
