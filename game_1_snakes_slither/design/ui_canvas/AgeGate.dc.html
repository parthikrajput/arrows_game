<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Age gate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2E7D32}a:hover{color:#1B5E20}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: linear-gradient(180deg, #E4F4E6 0%, #D3ECD4 100%); color: #1B2B1F; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 96px 24px 32px; gap: 18px; text-align: center;">
  <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 30px;">When were you born?</h1>
  <p style="margin: 0; max-width: 30ch; font-size: 15px; font-weight: 700; line-height: 1.45; color: #5B6B5F;">We ask once so the game shows the right kind of ads. Your answer stays on this phone.</p>

  <div style="position: relative; width: 220px; height: 264px; border-radius: 24px; background: #FFFBF2; box-shadow: inset 0 1px 0 #FFFFFF, 0 3px 0 rgba(150,130,90,0.3), 0 12px 26px rgba(30,60,30,0.16); overflow: hidden;">
    <div aria-hidden="true" style="position: absolute; left: 12px; right: 12px; top: 108px; height: 48px; border-radius: 14px; background: #E8F5E9; border: 2px solid #C8E6C9; box-sizing: border-box;"></div>
    <div role="listbox" aria-label="Birth year" style="position: relative; height: 264px; overflow-y: auto; padding: 108px 12px; box-sizing: border-box; display: flex; flex-direction: column; scrollbar-width: none;">
      <sc-for list="{{ years }}" as="y" hint-placeholder-count="12">
        <button role="option" aria-selected="{{ y.on }}" onClick="{{ y.pick }}" style="{{ y.style }}">{{ y.y }}</button>
      </sc-for>
    </div>
  </div>
  <span style="font-size: 14px; font-weight: 800; color: {{ statusColor }};">{{ status }}</span>

  <div style="margin-top: auto; align-self: stretch; display: flex; flex-direction: column; gap: 10px; align-items: center;">
    <sc-if value="{{ picked }}" hint-placeholder-val="{{ false }}">
      <a href="Home.dc.html" style="align-self: stretch; height: 58px; border-radius: 16px; background: linear-gradient(180deg, #A6E585 0%, #4CAF50 48%, #2E7D32 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,0.42), inset 0 -3px 0 rgba(0,0,0,0.14), 0 5px 0 #1B5E20, 0 12px 20px rgba(27,94,32,0.3); display: flex; align-items: center; justify-content: center; text-decoration: none; color: #FFFFFF; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px;">Continue</a>
    </sc-if>
    <sc-if value="{{ notPicked }}" hint-placeholder-val="{{ true }}">
      <button disabled style="align-self: stretch; height: 58px; border: 0; border-radius: 16px; background: #DDE5DE; color: #5B6B5F; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px;">Continue</button>
    </sc-if>
    <span style="font-size: 13px; font-weight: 800;"><a href="#" style="text-decoration: none;">Privacy Policy</a> · <a href="#" style="text-decoration: none;">Terms</a></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { year: null }; }
  renderVals() {
    const now = 2026, sel = this.state.year;
    const years = [];
    for (let y = now; y >= now - 100; y--) {
      const on = sel === y;
      years.push({
        y, on: on ? 'true' : 'false', pick: () => this.setState({ year: y }),
        style: 'flex-shrink: 0; height: 48px; border: 0; background: transparent; cursor: pointer; font-family: Fredoka, sans-serif; font-variant-numeric: tabular-nums; ' +
          (on ? 'font-weight: 700; font-size: 24px; color: #1B2B1F;' : 'font-weight: 500; font-size: 20px; color: #5B6B5F;')
      });
    }
    return {
      years, picked: sel !== null, notPicked: sel === null,
      status: sel === null ? 'Pick a year to continue' : 'Selected: ' + sel,
      statusColor: sel === null ? '#5B6B5F' : '#2E7D32'
    };
  }
}
</script>
</body>
</html>
