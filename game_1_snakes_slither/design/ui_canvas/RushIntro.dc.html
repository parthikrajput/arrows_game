<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Golden Slither Rush intro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2E7D32}a:hover{color:#1B5E20}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; color: #1B2B1F;">
  <dc-import name="Rush" hint-size="390px,844px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, rgba(30,24,4,0.35), rgba(10,18,8,0.75)); backdrop-filter: blur(4px);"></div>

  <div role="dialog" aria-labelledby="riTitle" style="position: absolute; left: 22px; right: 22px; top: 150px; border-radius: 28px; background: linear-gradient(180deg, #FFFDF4, #FFF4D6); box-shadow: 0 0 0 3px #FFE082, 0 0 40px rgba(255,202,40,0.45), 0 30px 60px rgba(0,0,0,0.4); padding: 24px 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
    <svg aria-hidden="true" width="120" height="76" viewBox="0 0 120 76">
      <defs><linearGradient id="riGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3B0"></stop><stop offset="0.5" stop-color="#FFC928"></stop><stop offset="1" stop-color="#B57E00"></stop></linearGradient></defs>
      <path d="M10 58 C 10 30, 40 34, 54 46 C 68 58, 96 58, 100 30" fill="none" stroke="#7A5200" stroke-width="17" stroke-linecap="round"></path>
      <path d="M10 58 C 10 30, 40 34, 54 46 C 68 58, 96 58, 100 30" fill="none" stroke="url(#riGold)" stroke-width="14" stroke-linecap="round"></path>
      <path d="M10 58 C 10 30, 40 34, 54 46 C 68 58, 96 58, 100 30" fill="none" stroke="#8A5A00" stroke-width="5" stroke-dasharray="3 8" opacity="0.5"></path>
      <ellipse cx="102" cy="24" rx="11" ry="9" fill="#FFD54F" stroke="#7A5200" stroke-width="1.6"></ellipse>
      <circle cx="98.5" cy="22" r="3" fill="#FFFFFF"></circle><circle cx="106" cy="22" r="3" fill="#FFFFFF"></circle>
      <circle cx="99" cy="22.5" r="1.5" fill="#111"></circle><circle cx="106.5" cy="22.5" r="1.5" fill="#111"></circle>
      <g fill="#FFFFFF"><path d="M22 10 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z"></path><path d="M70 6 l1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5 3.5 -1.5 z"></path></g>
    </svg>
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #9A6B00;">BONUS ROUND · AFTER LEVEL 25</span>
    <h2 id="riTitle" style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.05;">Golden Slither Rush!</h2>
    <div style="align-self: stretch; display: flex; flex-direction: column; gap: 8px; text-align: left;">
      <sc-for list="{{ rules }}" as="r" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.75);">
          <span style="width: 30px; height: 30px; flex-shrink: 0; border-radius: 15px; background: {{ r.bg }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px;">{{ r.icon }}</span>
          <span style="font-size: 15px; font-weight: 700;">{{ r.text }}</span>
        </div>
      </sc-for>
    </div>
    <a href="Rush.dc.html" style="align-self: stretch; height: 60px; border-radius: 30px; background: linear-gradient(180deg, #FFE082 0%, #FFB300 50%, #E08A00 100%); border: 2px solid #FFF3C4; box-shadow: inset 0 2px 0 rgba(255,255,255,0.6), 0 5px 0 #A86300, 0 14px 24px rgba(168,99,0,0.35); display: flex; align-items: center; justify-content: center; text-decoration: none; color: #4A2E00; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 1px;">START</a>
    <a href="Play.dc.html" style="min-height: 40px; display: flex; align-items: center; text-decoration: none; color: #6B7A6E; font-weight: 800; font-size: 14px;">Skip</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rules: [
        { icon: '30', bg: '#E08A00', text: '30 seconds — tap fast!' },
        { icon: '+10', bg: '#2E7D32', text: '+10 coins for every golden snake' },
        { icon: '20', bg: '#7A5200', text: 'Clear all 20 for +100 bonus' },
        { icon: '♥', bg: '#9AA59D', text: 'No hearts, no boosters, no bonks' }
      ]
    };
  }
}
</script>
</body>
</html>
