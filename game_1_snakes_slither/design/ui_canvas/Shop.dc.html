<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2E7D32}a:hover{color:#1B5E20}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; isolation: isolate; background: linear-gradient(180deg, #E4F4E6 0%, #D3ECD4 100%); color: #1B2B1F; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; padding: 12px 16px 14px; gap: 12px;">
  <header style="height: 48px; display: flex; align-items: center; gap: 10px;">
    <a href="Home.dc.html" aria-label="Back to home" style="width: 46px; height: 46px; border-radius: 23px; box-sizing: border-box; background: radial-gradient(circle at 35% 25%, #FFFFFF, #F5EFDF 60%, #E3D7B9); border: 2px solid #FFFFFF; box-shadow: 0 4px 0 #B9A77F, 0 8px 14px rgba(40,60,30,0.18); display: flex; align-items: center; justify-content: center; color: #1B2B1F;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"></path></svg>
    </a>
    <h1 style="margin: 0; flex-grow: 1; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px;">Shop</h1>
    <span style="height: 38px; padding: 0 12px 0 6px; border-radius: 19px; box-sizing: border-box; background: linear-gradient(180deg, #FFFFFF, #F2ECDD); border: 2px solid #FFFFFF; box-shadow: 0 3px 0 #C9B993, 0 6px 12px rgba(40,60,30,0.15); display: flex; align-items: center; gap: 6px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums;">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FFCA28" stroke="#B8860B" stroke-width="1.6"></circle><path d="M8.5 14.5 C 9 9.5, 13.5 7.5, 16 8 C 15.5 12.5, 12 15, 8.5 14.5 Z" fill="#FFE082" stroke="#B8860B" stroke-width="1.1"></path></svg>1,250</span>
  </header>

  <div role="tablist" aria-label="Shop sections" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 18px; background: #FFFBF2;">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
      <button role="tab" aria-selected="{{ t.on }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.name }}</button>
    </sc-for>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
    <sc-if value="{{ isBoosters }}" hint-placeholder-val="{{ true }}">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
          <button aria-label="{{ it.aria }}" style="min-height: 150px; border-radius: 22px; border: 1px solid #FFFFFF; background: linear-gradient(180deg, #FFFFFF, #FBF7EE); box-shadow: 0 10px 24px rgba(30,60,30,0.12); padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; color: #1B2B1F;">
            <span style="position: relative; width: 76px; height: 70px; border-radius: 20px; background: radial-gradient(circle at 50% 55%, #F3FAEE 0%, #E0F0DA 70%, rgba(224,240,218,0) 100%); display: flex; align-items: center; justify-content: center;">
              <dc-import name="Booster" kind="{{ it.kind }}" size="{{ 60 }}" hint-size="60px,60px"></dc-import>
              <span style="position: absolute; right: -6px; top: -4px; height: 22px; padding: 0 7px; border-radius: 11px; background: #1B2B1F; border: 2px solid #FFFFFF; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center;">×{{ it.qty }}</span>
            </span>
            <span style="font-size: 13px; font-weight: 800; text-align: center;">{{ it.name }}</span>
            <span style="height: 30px; padding: 0 12px; border-radius: 15px; background: {{ it.priceBg }}; color: {{ it.priceFg }}; display: flex; align-items: center; gap: 5px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px;">
              <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FFCA28" stroke="#B8860B" stroke-width="2"></circle></svg>{{ it.price }}</span>
          </button>
        </sc-for>
      </div>
      <button style="min-height: 60px; border-radius: 18px; border: 2px dashed #66BB6A; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; color: #1B2B1F; cursor: pointer;">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3" fill="none" stroke="#1B2B1F" stroke-width="2"></rect><path d="M10 9 L15 12 L10 15 Z" fill="#1B2B1F"></path></svg>
        Free +50 coins <span style="font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; color: #5B6B5F;">3 left today</span></button>
    </sc-if>

    <sc-if value="{{ isCoins }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <sc-for list="{{ packs }}" as="p" hint-placeholder-count="4">
          <button aria-label="{{ p.aria }}" style="position: relative; min-height: 78px; border-radius: 20px; border: {{ p.border }}; background: linear-gradient(180deg, #FFFFFF, #FBF7EE); box-shadow: 0 10px 24px rgba(30,60,30,0.12); padding: 12px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: #1B2B1F; text-align: left;">
            <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="18" cy="26" r="12" fill="#FFCA28" stroke="#B8860B" stroke-width="2"></circle><circle cx="27" cy="18" r="12" fill="#FFCA28" stroke="#B8860B" stroke-width="2"></circle><path d="M22 22 C 23 15, 29 12, 33 13 C 32 19, 27 23, 22 22 Z" fill="#FFE082" stroke="#B8860B" stroke-width="1.4"></path></svg>
            <span style="flex-grow: 1; display: flex; flex-direction: column;">
              <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums;">{{ p.coins }}</span>
              <span style="font-size: 13px; font-weight: 800; color: #5B6B5F;">coins</span>
            </span>
            <span style="height: 40px; padding: 0 16px; border-radius: 14px; background: #2E7D32; color: #FFFFFF; display: flex; align-items: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px;">{{ p.price }}</span>
            <sc-if value="{{ p.hasBadge }}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; top: -10px; left: 14px; height: 22px; padding: 0 10px; border-radius: 11px; background: #FFCA28; color: #1B2B1F; display: flex; align-items: center; font-size: 11px; font-weight: 800;">{{ p.badge }}</span>
            </sc-if>
          </button>
        </sc-for>
        <span style="font-size: 12px; font-weight: 700; color: #5B6B5F; text-align: center;">Prices come from the store in your currency.</span>
      </div>
    </sc-if>

    <sc-if value="{{ isOffers }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="border-radius: 22px; background: #FFFBF2; box-shadow: inset 0 1px 0 #FFFFFF, 0 3px 0 rgba(150,130,90,0.3), 0 12px 26px rgba(30,60,30,0.16); padding: 16px; display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px;">Starter Pack</span>
            <span style="height: 26px; padding: 0 10px; border-radius: 13px; background: #FFEBEE; color: #C62828; display: flex; align-items: center; font-size: 12px; font-weight: 800;">31 h left · once only</span>
          </div>
          <span style="font-size: 15px; font-weight: 700; color: #3B5240;">800 coins + 3 Firefly Hints + 2 Stone Hammers + 2 Shell Shields</span>
          <button style="height: 52px; border: 0; border-radius: 30px; background: linear-gradient(180deg, #A6E585 0%, #4CAF50 48%, #2E7D32 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,0.42), inset 0 -3px 0 rgba(0,0,0,0.14), 0 5px 0 #1B5E20, 0 12px 20px rgba(27,94,32,0.3); color: #FFFFFF; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; cursor: pointer;">₹79</button>
        </div>
        <a href="Vip.dc.html" style="border-radius: 22px; background: #EDE7F6; padding: 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1B2B1F;">
          <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18 L5 8 L9.5 12 L12 5 L14.5 12 L19 8 L21 18 Z" fill="#B39DDB" stroke="#4527A0" stroke-width="1.4" stroke-linejoin="round"></path></svg>
          <span style="flex-grow: 1; display: flex; flex-direction: column;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 19px;">VIP No-Ads Pass</span>
            <span style="font-size: 13px; font-weight: 800; color: #4527A0;">₹20 / month · auto-renews</span>
          </span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4527A0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5 L16 12 L9 19"></path></svg>
        </a>
      </div>
    </sc-if>
  </div>

  <span style="text-align: center; font-size: 13px; font-weight: 800;"><a href="#" style="text-decoration: none;">Restore purchases</a> · <a href="#" style="text-decoration: none;">Terms</a></span>
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; pointer-events: none;"><dc-import name="Backdrop" hint-size="390px,844px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'Boosters' }; }
  renderVals() {
    const tab = this.state.tab;
    const tabs = ['Boosters', 'Coins', 'Offers'].map((name) => {
      const on = tab === name;
      return { name, on: on ? 'true' : 'false', pick: () => this.setState({ tab: name }),
        style: 'height: 44px; border: 0; border-radius: 14px; cursor: pointer; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 16px; ' +
          (on ? 'background: #2E7D32; color: #FFFFFF;' : 'background: transparent; color: #1B2B1F;') };
    });
    const defs = [
      ['hint', 'Glow Firefly Hint', 60, 150],
      ['shield', 'Safety Shell Shield', 80, 200], ['hammer', 'Magic Stone Hammer', 100, 250]
    ];
    const items = [];
    defs.forEach((d) => {
      [[1, d[2]], [3, d[3]]].forEach(([qty, price]) => {
        items.push({ kind: d[0], hint: d[0] === 'hint', shield: d[0] === 'shield', hammer: d[0] === 'hammer',
          name: d[1], qty, price, priceBg: qty === 3 ? '#2E7D32' : '#E8F5E9', priceFg: qty === 3 ? '#FFFFFF' : '#1B2B1F',
          aria: qty + ' ' + d[1] + ' for ' + price + ' coins' });
      });
    });
    const packs = [
      { coins: '350', price: '₹49', badge: '' }, { coins: '1,000', price: '₹149', badge: 'POPULAR' },
      { coins: '2,200', price: '₹299', badge: '' }, { coins: '5,500', price: '₹699', badge: 'BEST VALUE' }
    ].map((p) => ({ ...p, hasBadge: !!p.badge, border: p.badge ? '2px solid #FFCA28' : '0', aria: p.coins + ' coins for ' + p.price }));
    return { tabs, isBoosters: tab === 'Boosters', isCoins: tab === 'Coins', isOffers: tab === 'Offers', items, packs };
  }
}
</script>
</body>
</html>
