<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jungle Treasure Chest</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#FFE082}a:hover{color:#FFF8E1}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: radial-gradient(ellipse 120% 80% at 50% 35%, #3A6B33 0%, #1C4A22 50%, #0D2A12 100%); color: #FFFFFF; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 60px 20px 28px; gap: 12px; text-align: center;">
  <svg aria-hidden="true" width="390" height="460" viewBox="0 0 390 460" style="position: absolute; left: 0; top: 0;">
    <defs>
      <radialGradient id="chGlow"><stop offset="0" stop-color="#FFE57F" stop-opacity="0.85"></stop><stop offset="0.5" stop-color="#FFD54F" stop-opacity="0.25"></stop><stop offset="1" stop-color="#FFD54F" stop-opacity="0"></stop></radialGradient>
      <linearGradient id="chRay" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FFE082" stop-opacity="0.55"></stop><stop offset="1" stop-color="#FFE082" stop-opacity="0"></stop></linearGradient>
    </defs>
    <circle cx="195" cy="270" r="210" fill="url(#chGlow)"></circle>
    <g fill="url(#chRay)"><path d="M195 250 L150 0 H180 Z"></path><path d="M195 250 L212 0 H242 Z"></path><path d="M195 250 L30 40 L54 26 Z"></path><path d="M195 250 L360 30 L336 18 Z"></path></g>
    <g fill="#FFFFFF"><path d="M70 150 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5 z"></path><path d="M320 120 l2 5.5 5.5 2 -5.5 2 -2 5.5 -2 -5.5 -5.5 -2 5.5 -2 z"></path><circle cx="300" cy="330" r="2.4"></circle><circle cx="90" cy="360" r="2"></circle></g>
  </svg>

  <span style="position: relative; font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #FFE082;">LEVEL 500 · PHASE 1 FINALE</span>
  <h1 style="position: relative; margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.05; text-shadow: 0 3px 10px rgba(0,0,0,0.4);">Jungle Treasure Chest!</h1>

  <svg role="img" aria-label="Opened treasure chest full of gold coins" width="250" height="210" viewBox="0 0 250 210" style="position: relative;">
    <defs>
      <linearGradient id="chWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B07A45"></stop><stop offset="1" stop-color="#5D3A1E"></stop></linearGradient>
      <linearGradient id="chLidIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B2412"></stop><stop offset="1" stop-color="#6B4322"></stop></linearGradient>
      <linearGradient id="chGold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9A6A00"></stop><stop offset="0.3" stop-color="#FFE38A"></stop><stop offset="0.6" stop-color="#F6C431"></stop><stop offset="1" stop-color="#8A5A00"></stop></linearGradient>
      <radialGradient id="chCoin" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFF6C4"></stop><stop offset="0.45" stop-color="#FFC928"></stop><stop offset="1" stop-color="#B57E00"></stop></radialGradient>
      <filter id="chSh" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="6"></feGaussianBlur></filter>
    </defs>
    <ellipse cx="125" cy="196" rx="96" ry="9" fill="#000" opacity="0.4" filter="url(#chSh)"></ellipse>
    <path d="M40 92 L52 20 Q125 0 198 20 L210 92 Z" fill="url(#chLidIn)" stroke="#2A170A" stroke-width="2"></path>
    <path d="M52 20 Q125 0 198 20" fill="none" stroke="url(#chGold)" stroke-width="8"></path>
    <ellipse cx="125" cy="96" rx="86" ry="18" fill="#FFC928"></ellipse>
    <sc-for list="{{ pile }}" as="c" hint-placeholder-count="12">
      <g transform="{{ c.t }}"><ellipse cx="0" cy="2" rx="13" ry="{{ c.ry }}" fill="#8D6200"></ellipse><ellipse rx="13" ry="{{ c.ry }}" fill="url(#chCoin)" stroke="#8D6200" stroke-width="0.9"></ellipse></g>
    </sc-for>
    <path d="M30 100 H220 L212 186 Q125 196 38 186 Z" fill="url(#chWood)" stroke="#2A170A" stroke-width="2" stroke-linejoin="round"></path>
    <path d="M36 126 H214 M38 154 H212" stroke="#3B2412" stroke-width="2" opacity="0.6"></path>
    <rect x="26" y="96" width="198" height="14" rx="4" fill="url(#chGold)" stroke="#6B4400" stroke-width="1.4"></rect>
    <path d="M56 110 V188 M194 110 V188" stroke="url(#chGold)" stroke-width="10"></path>
    <rect x="108" y="116" width="34" height="40" rx="6" fill="url(#chGold)" stroke="#6B4400" stroke-width="1.6"></rect>
    <circle cx="125" cy="132" r="5" fill="#3B2412"></circle><path d="M125 134 V146" stroke="#3B2412" stroke-width="3.5" stroke-linecap="round"></path>
  </svg>

  <div style="position: relative; align-self: stretch; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
    <sc-for list="{{ rewards }}" as="r" hint-placeholder-count="4">
      <div style="border-radius: 18px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,224,130,0.3); padding: 8px 10px; display: flex; align-items: center; gap: 8px; text-align: left;">
        <sc-if value="{{ r.isCoin }}" hint-placeholder-val="{{ false }}">
          <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><defs><radialGradient id="chC2" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFF6C4"></stop><stop offset="0.45" stop-color="#FFC928"></stop><stop offset="1" stop-color="#B57E00"></stop></radialGradient></defs><circle cx="12" cy="12" r="10.2" fill="url(#chC2)" stroke="#8D6200" stroke-width="0.9"></circle></svg>
        </sc-if>
        <sc-if value="{{ r.isBooster }}" hint-placeholder-val="{{ true }}">
          <dc-import name="Booster" kind="{{ r.kind }}" size="{{ 40 }}" hint-size="40px,40px"></dc-import>
        </sc-if>
        <span style="display: flex; flex-direction: column;"><b style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.1; color: #FFE082;">{{ r.amount }}</b><span style="font-size: 12px; font-weight: 800; color: #C8E6C9;">{{ r.name }}</span></span>
      </div>
    </sc-for>
  </div>
  <div style="position: relative; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 18px; background: linear-gradient(180deg, #FFF3B0, #FFC928); color: #4A2E00; font-weight: 800; font-size: 14px;">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3 H18 V8 a6 6 0 0 1 -12 0 Z" fill="#B57E00"></path><rect x="10" y="14" width="4" height="4" fill="#B57E00"></rect><rect x="7" y="18" width="10" height="3" rx="1" fill="#5D3A1E"></rect></svg>
    "Garden Hero" badge unlocked
  </div>

  <a href="RushIntro.dc.html" style="position: relative; margin-top: auto; align-self: stretch; height: 60px; border-radius: 30px; background: linear-gradient(180deg, #FFE082 0%, #FFB300 50%, #E08A00 100%); border: 2px solid #FFF3C4; box-shadow: inset 0 2px 0 rgba(255,255,255,0.6), 0 5px 0 #A86300, 0 14px 24px rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; text-decoration: none; color: #4A2E00; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 21px;">Collect</a>
  <span style="position: relative; font-size: 12px; font-weight: 700; color: #C8E6C9;">Next: Golden Slither Rush (30 snakes), then Phase Complete</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [[62, 92, 0, 6], [90, 86, -8, 7], [118, 82, 6, 6], [146, 84, -4, 7], [174, 88, 8, 6], [196, 94, 0, 5], [80, 74, -20, 9], [108, 68, 10, 8], [140, 66, -12, 9], [166, 72, 16, 8], [118, 52, -30, 13], [148, 50, 20, 13]];
    const pile = raw.map((c) => ({ t: 'translate(' + c[0] + ' ' + c[1] + ') rotate(' + c[2] + ')', ry: c[3] }));
    const rewards = [
      { isCoin: true, isBooster: false, kind: 'hint', amount: '1,000', name: 'coins' },
      { isCoin: false, isBooster: true, kind: 'hint', amount: '×2', name: 'Glow Firefly Hint' },
      { isCoin: false, isBooster: true, kind: 'shield', amount: '×2', name: 'Safety Shell Shield' },
      { isCoin: false, isBooster: true, kind: 'hammer', amount: '×2', name: 'Magic Stone Hammer' }
    ];
    return { pile, rewards };
  }
}
</script>
</body>
</html>
