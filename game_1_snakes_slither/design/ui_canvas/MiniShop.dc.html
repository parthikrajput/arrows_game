<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mini shop sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2E7D32}a:hover{color:#1B5E20}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; color: #1B2B1F;">
  <dc-import name="Play" mode="play" level="{{ 37 }}" hearts="{{ 2 }}" moves="{{ 9 }}" hint-size="390px,844px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(16,32,20,0.35), rgba(8,18,10,0.65)); backdrop-filter: blur(3px);"></div>

  <div role="dialog" aria-labelledby="miniTitle" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 24px 24px 0 0; background: #FFFBF2; box-shadow: 0 -8px 24px rgba(0,0,0,0.12); padding: 10px 20px 26px; display: flex; flex-direction: column; gap: 12px;">
    <span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #C8E6C9;"></span>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 18px; background: #FFF8E1; display: flex; align-items: center; justify-content: center;">
        <dc-import name="Booster" kind="hint" size="{{ 50 }}" hint-size="50px,50px"></dc-import>
      </span>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <h2 id="miniTitle" style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px;">Out of Firefly Hints</h2>
        <span style="font-size: 13px; font-weight: 700; color: #5B6B5F;">Game paused · you have 1,250 coins</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <button style="min-height: 92px; border-radius: 18px; background: #FFFFFF; border: 2px solid #C8E6C9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; color: #1B2B1F;">
        <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px;">1 Hint</span>
        <span style="display: flex; align-items: center; gap: 4px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px;"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FFCA28" stroke="#B8860B" stroke-width="2"></circle></svg>60</span>
      </button>
      <button style="position: relative; min-height: 92px; border: 0; border-radius: 18px; background: linear-gradient(180deg, #A6E585 0%, #4CAF50 48%, #2E7D32 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,0.42), inset 0 -3px 0 rgba(0,0,0,0.14), 0 5px 0 #1B5E20, 0 12px 20px rgba(27,94,32,0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; color: #FFFFFF;">
        <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px;">3 Hints</span>
        <span style="display: flex; align-items: center; gap: 4px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px;"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FFCA28" stroke="#B8860B" stroke-width="2"></circle></svg>150</span>
        <span style="position: absolute; top: -10px; height: 20px; padding: 0 8px; border-radius: 10px; background: #FFCA28; color: #1B2B1F; display: flex; align-items: center; font-size: 11px; font-weight: 800;">SAVE 30</span>
      </button>
    </div>
    <button style="min-height: 54px; border-radius: 28px; background: #FFFFFF; border: 2px dashed #66BB6A; color: #1B2B1F; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3" fill="none" stroke="#1B2B1F" stroke-width="2"></rect><path d="M10 9 L15 12 L10 15 Z" fill="#1B2B1F"></path></svg>
      Watch ad · +50 coins <span style="font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; color: #5B6B5F;">3 left today</span></button>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <a href="Shop.dc.html" style="min-height: 44px; display: flex; align-items: center; text-decoration: none; font-weight: 800; font-size: 15px;">Get more coins ›</a>
      <a href="Play.dc.html" style="min-height: 44px; display: flex; align-items: center; text-decoration: none; color: #5B6B5F; font-weight: 800; font-size: 15px;">Back to game</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
