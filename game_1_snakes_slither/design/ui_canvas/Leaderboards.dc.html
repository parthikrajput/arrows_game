<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leaderboards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2E7D32}a:hover{color:#1B5E20}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; isolation: isolate; background: linear-gradient(180deg, #FBF8F0 0%, #F2ECDD 100%); color: #1B2B1F; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; padding: 12px 16px 20px; gap: 14px;">
  <header style="height: 48px; display: flex; align-items: center; gap: 10px;">
    <a href="Home.dc.html" aria-label="Back to home" style="width: 46px; height: 46px; border-radius: 23px; box-sizing: border-box; background: radial-gradient(circle at 35% 25%, #FFFFFF, #F5EFDF 60%, #E3D7B9); border: 2px solid #FFFFFF; box-shadow: 0 4px 0 #B9A77F, 0 8px 14px rgba(40,60,30,0.18); display: flex; align-items: center; justify-content: center; color: #1B2B1F;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px;">Leaderboards</h1>
  </header>

  <div role="tablist" aria-label="Board" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 18px; background: #FFFBF2;">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
      <button role="tab" aria-selected="{{ t.on }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.name }}</button>
    </sc-for>
  </div>

  <div style="border-radius: 24px; background: #FFFBF2; box-shadow: inset 0 1px 0 #FFFFFF, 0 3px 0 rgba(150,130,90,0.3), 0 12px 26px rgba(30,60,30,0.16); padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.6px; color: #5B6B5F;">YOUR {{ metricLabel }}</span>
    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 52px; line-height: 1; font-variant-numeric: tabular-nums;">{{ metricValue }}</span>
    <span style="font-size: 14px; font-weight: 700; color: #5B6B5F;">{{ metricNote }}</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
    <div style="border-radius: 18px; background: rgba(255,255,255,0.92); box-shadow: 0 8px 20px rgba(30,60,30,0.1); padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px;">Lv 37</span><span style="font-size: 12px; font-weight: 800; color: #5B6B5F;">highest</span></div>
    <div style="border-radius: 18px; background: rgba(255,255,255,0.92); box-shadow: 0 8px 20px rgba(30,60,30,0.1); padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px;">98</span><span style="font-size: 12px; font-weight: 800; color: #5B6B5F;">stars</span></div>
    <div style="border-radius: 18px; background: rgba(255,255,255,0.92); box-shadow: 0 8px 20px rgba(30,60,30,0.1); padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px;">
      <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px;">12</span><span style="font-size: 12px; font-weight: 800; color: #5B6B5F;">streak days</span></div>
  </div>

  <sc-if value="{{ signedIn }}" hint-placeholder-val="{{ true }}">
    <button style="height: 58px; border: 0; border-radius: 30px; background: linear-gradient(180deg, #A6E585 0%, #4CAF50 48%, #2E7D32 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,0.42), inset 0 -3px 0 rgba(0,0,0,0.14), 0 5px 0 #1B5E20, 0 12px 20px rgba(27,94,32,0.3); color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; cursor: pointer;">See friends &amp; world ranks
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5 L16 12 L9 19"></path></svg></button>
    <span style="text-align: center; font-size: 13px; font-weight: 700; color: #5B6B5F;">Opens Play Games / Game Center</span>
  </sc-if>
  <sc-if value="{{ signedOut }}" hint-placeholder-val="{{ false }}">
    <div style="border-radius: 20px; background: #FFFFFF; border: 2px dashed #9AA59D; padding: 16px; display: flex; flex-direction: column; gap: 10px; text-align: center;">
      <span style="font-size: 15px; font-weight: 700; color: #3B5240;">Sign in to compare with friends. The game works fine without it.</span>
      <button style="height: 52px; border: 0; border-radius: 16px; background: #1B2B1F; color: #FFFFFF; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; cursor: pointer;">Sign in</button>
    </div>
  </sc-if>

  <p style="margin: auto 0 0; text-align: center; font-size: 12px; font-weight: 700; color: #5B6B5F;">Ranks are just for fun. Rewards never depend on your rank.</p>
  <div aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; pointer-events: none;"><dc-import name="Backdrop" hint-size="390px,844px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"signedIn":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'Highest Lv' }; }
  renderVals() {
    const signedIn = this.props.signedIn ?? true;
    const data = {
      'Highest Lv': ['HIGHEST LEVEL', '37', 'Garden Meadow'],
      'Stars': ['TOTAL STARS', '98', 'Numbered levels only, not dailies'],
      'Streak': ['TOTAL STREAK DAYS', '12', 'Counts every Daily you clear']
    };
    const tab = this.state.tab;
    const tabs = Object.keys(data).map((name) => {
      const on = tab === name;
      return { name, on: on ? 'true' : 'false', pick: () => this.setState({ tab: name }),
        style: 'height: 44px; border: 0; border-radius: 14px; cursor: pointer; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 15px; ' +
          (on ? 'background: #2E7D32; color: #FFFFFF;' : 'background: transparent; color: #1B2B1F;') };
    });
    const d = data[tab];
    return { tabs, metricLabel: d[0], metricValue: d[1], metricNote: d[2], signedIn, signedOut: !signedIn };
  }
}
</script>
</body>
</html>
