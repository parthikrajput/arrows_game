<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leaderboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.ss-press{transition:transform .14s cubic-bezier(.3,1.6,.5,1),box-shadow .14s}
.ss-press:hover{transform:translateY(-1px)}
.ss-press:active{transform:translateY(2px) scale(.97)}
@keyframes ssBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes ssPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes ssGlow{0%,100%{box-shadow:0 0 0 0 rgba(168,217,79,.55)}60%{box-shadow:0 0 0 14px rgba(168,217,79,0)}}
@keyframes ssIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ssPop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes ssFall{0%{transform:translate(0,-60px) rotate(0)}100%{transform:translate(60px,920px) rotate(260deg)}}
@keyframes ssSway{0%,100%{transform:perspective(600px) rotateY(-10deg)}50%{transform:perspective(600px) rotateY(10deg)}}
@keyframes ssFloatUp{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
@keyframes ssConfetti{0%{transform:translateY(-40px) rotate(0)}100%{transform:translateY(860px) rotate(540deg)}}
@keyframes ssShine{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(220%) skewX(-20deg)}}
.ss-in{animation:ssIn .5s cubic-bezier(.2,.9,.3,1) both}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; isolation: isolate; background: radial-gradient(ellipse 120% 70% at 50% 0%, #FFFEF8 0%, #F7F4E8 55%, #EFE9D3 100%); color: #163B28; font-family: 'Nunito', system-ui, sans-serif; ">
<div aria-hidden="true" style="position: relative; z-index: 3; height: 44px; padding: 0 22px 0 26px; display: flex; align-items: center; justify-content: space-between; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: #163B28;"><span>9:41</span><span style="display: flex; gap: 6px; align-items: center;"><svg width="18" height="12" viewBox="0 0 18 12"><g fill="#163B28"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg><svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 L5.6 9 A3.4 3.4 0 0 1 10.4 9 Z M2.8 6.3 A7.4 7.4 0 0 1 13.2 6.3 L11.8 7.7 A5.4 5.4 0 0 0 4.2 7.7 Z M0 3.5 A11.4 11.4 0 0 1 16 3.5 L14.6 4.9 A9.4 9.4 0 0 0 1.4 4.9 Z" fill="#163B28"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3" fill="none" stroke="#163B28" opacity="0.45"/><rect x="2" y="2" width="17" height="8" rx="2" fill="#163B28"/><rect x="23.5" y="4" width="1.8" height="4" rx="1" fill="#163B28" opacity="0.45"/></svg></span></div><header style="position: relative; z-index: 2; height: 56px; padding: 0 16px; display: flex; align-items: center; gap: 12px;"><a href="Home.dc.html" aria-label="Back" class="ss-press" style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: #FFFEF8; border: 1px solid #ECE5CF; box-shadow: 0 3px 0 #DDD3B6, 0 6px 14px rgba(22,59,40,0.1); display: flex; align-items: center; justify-content: center; color: #163B28;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg></a><h1 style="margin: 0; flex: 1; text-align: center; padding-right: 52px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px;">Leaderboards</h1></header><div style="position: relative; z-index: 2; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 10px;"><div role="tablist" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: #EDE6D0; box-shadow: inset 0 1px 2px rgba(0,0,0,0.06);"><sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><button role="tab" aria-selected="{{ t.on }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.name }}</button></sc-for></div><div style="display: flex; flex-direction: column; gap: 6px;"><sc-for list="{{ rows }}" as="r" hint-placeholder-count="8"><div class="ss-in" style="{{ r.style }}"><span style="{{ r.badge }}">{{ r.rank }}</span><span style="width: 36px; height: 36px; border-radius: 18px; overflow: hidden; flex: none; background: {{ r.av }}; display: flex; align-items: flex-end; justify-content: center;"><svg width="36" height="36" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="16" r="7" fill="{{ r.avc }}"/><path d="M7 34 C 9 25, 31 25, 33 34 A 20 20 0 0 1 7 34 Z" fill="{{ r.avc }}"/></svg></span><span style="flex: 1; font-size: 15px; font-weight: 800;">{{ r.name }}</span><span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums;">{{ r.score }}</span></div></sc-for></div></div><div style="position: absolute; z-index: 2; left: 16px; right: 16px; bottom: 30px; padding: 12px 16px; border-radius: 18px; background: linear-gradient(180deg, #23A766, #075B35); color: #FFF; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 0 #03432A, 0 12px 22px rgba(7,91,53,0.25);"><span style="font-size: 14px; font-weight: 800; opacity: 0.9;">You {{ myRank }}<br><span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; opacity: 1;">{{ myScore }}</span></span><span style="height: 36px; padding: 0 12px; border-radius: 12px; background: #FFFEF8; color: #075B35; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px; display: flex; align-items: center;">Open Play Games ▸</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'Highest Lv' }; }
  tabsOf(names, cur, key) {
    return names.map((name) => {
      const on = cur === name;
      return { name, on: on ? 'true' : 'false', pick: () => this.setState({ [key]: name }),
        style: 'height: 36px; border: 0; border-radius: 12px; cursor: pointer; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 15px; transition: background .2s, color .2s; ' +
          (on ? 'background: linear-gradient(180deg, #1E9C5C, #0B6B3E); color: #FFFFFF; box-shadow: 0 3px 8px rgba(7,91,53,0.3);' : 'background: transparent; color: #4C6152;') };
    });
  }
  renderVals() {
    const tab = this.state.tab;
    const D = { 'Highest Lv': [['SnakeKing', 500], ['SlitherPro', 482], ['GreenNinja', 431], ['LeafLord', 377], ['Player123', 37], ['NagaPlay', 33], ['QuickTail', 28], ['Mia', 21]], Stars: [['SnakeKing', 1488], ['SlitherPro', 1402], ['GreenNinja', 1210], ['LeafLord', 1034], ['Player123', 98], ['NagaPlay', 90], ['QuickTail', 71], ['Mia', 55]], Streak: [['NagaPlay', 120], ['SnakeKing', 96], ['Mia', 64], ['SlitherPro', 41], ['GreenNinja', 30], ['Player123', 12], ['QuickTail', 9], ['LeafLord', 4]] };
    const unit = { 'Highest Lv': (v) => 'Lv ' + v, Stars: (v) => v.toLocaleString('en-US') + ' ★', Streak: (v) => v + ' days' }[tab];
    
    const data = D[tab];
    const medal = ['#F4B72F', '#B8C2C8', '#D58A4B'], dark = ['#8A5A00', '#55626A', '#7A4318'];
    const avs = [['#FDE7C2', '#D98E10'], ['#DDEFD0', '#13864D'], ['#DDEBFA', '#3A7BC8'], ['#F6DDEB', '#C2457E'], ['#EDE3FA', '#7A4FC2']];
    const rows = data.map(([name, s], i) => {
      const me = name === 'Player123', a = avs[i % avs.length];
      return { rank: i + 1, name: me ? name + ' (you)' : name, score: unit(s), av: a[0], avc: a[1],
        badge: 'width: 30px; height: 30px; flex: none; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 15px; ' +
          (i < 3 ? 'background: ' + medal[i] + '; color: ' + dark[i] + '; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15), 0 2px 6px rgba(0,0,0,0.15);' : 'background: transparent; color: #6B7F70;'),
        style: 'animation-delay: ' + (i * 0.04) + 's; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 16px; ' +
          (me ? 'background: #E3F2D3; border: 2px solid #A8D94F;' : 'background: #FFFEF8; border: 1px solid #ECE5CF;') };
    });
    const mi = data.findIndex((d) => d[0] === 'Player123');
    return { tabs: this.tabsOf(['Highest Lv', 'Stars', 'Streak'], tab, 'tab'), rows, myRank: '#' + (mi + 1), myScore: 'Lv 37 · 98 ★ · 12 🔥' };
  }
}
</script>
</body>
</html>
