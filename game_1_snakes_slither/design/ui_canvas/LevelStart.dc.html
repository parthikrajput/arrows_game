<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Level start sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2E7D32}a:hover{color:#1B5E20}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; color: #1B2B1F;">
  <dc-import name="LevelMap" hint-size="390px,844px"></dc-import>
  <a href="LevelMap.dc.html" aria-label="Close" style="position: absolute; inset: 0; background: rgba(8,18,10,0.5); backdrop-filter: blur(3px);"></a>

  <div role="dialog" aria-labelledby="lsTitle" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 28px 28px 0 0; background: #FFFBF2; box-shadow: 0 -12px 40px rgba(0,0,0,0.3); padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 14px;">
    <span aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #D5E3D3;"></span>
    <div style="display: flex; gap: 14px; align-items: center;">
      <div style="flex-shrink: 0; width: 112px; height: 112px; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 18px rgba(30,60,30,0.2);">
        <dc-import name="Board" mode="thumb" size="{{ 112 }}" hint-size="112px,112px"></dc-import>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0;">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.8px; color: #6B7A6E;">GARDEN MEADOW · NORMAL</span>
        <h2 id="lsTitle" style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; line-height: 1;">Level 37</h2>
        <div role="img" aria-label="Best: no stars yet" style="display: flex; gap: 4px;">
          <sc-for list="{{ stars }}" as="s" hint-placeholder-count="3">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.2l-5.9 3.3 1.3-6.6-4.9-4.5 6.6-.8z" fill="{{ s.fill }}" stroke="{{ s.stroke }}" stroke-width="1.3" stroke-linejoin="round"></path></svg>
          </sc-for>
        </div>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: #4C5C50;">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="14" rx="9" ry="7" fill="#9AA39C" stroke="#4E5A53" stroke-width="1.2"></ellipse><path d="M7 11 Q 11 8 15 10" fill="none" stroke="#7CB342" stroke-width="2" stroke-linecap="round"></path></svg>
          Garden Rock · 3 hearts
        </span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{ facts }}" as="f" hint-placeholder-count="3">
        <div style="border-radius: 14px; background: #F1F6EF; padding: 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px;">
          <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums;">{{ f.v }}</span>
          <span style="font-size: 11px; font-weight: 800; color: #6B7A6E;">{{ f.k }}</span>
        </div>
      </sc-for>
    </div>
    <a href="Play.dc.html" style="height: 60px; border-radius: 30px; background: linear-gradient(180deg, #A6E585 0%, #4CAF50 48%, #2E7D32 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,0.42), inset 0 -3px 0 rgba(0,0,0,0.14), 0 5px 0 #1B5E20, 0 12px 20px rgba(27,94,32,0.3); display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; color: #FFFFFF; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 21px;">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 L20 12 L7 20 Z" fill="#FFFFFF"></path></svg>Play</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      stars: [0, 1, 2].map(() => ({ fill: '#FFFFFF', stroke: '#B8C2BA' })),
      facts: [{ v: '7×7', k: 'garden' }, { v: '11', k: 'snakes' }, { v: '+20', k: 'coins' }]
    };
  }
}
</script>
</body>
</html>
