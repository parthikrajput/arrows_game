<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pip mascot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<sc-if value="{{ use3d }}" hint-placeholder-val="{{ true }}">
  <img src="{{ src }}" alt="{{ label }}" width="{{ size }}" height="{{ size }}" style="display: block; object-fit: contain; filter: drop-shadow(0 10px 14px rgba(20,50,20,0.22));">
</sc-if>
<sc-if value="{{ useSvg }}" hint-placeholder-val="{{ false }}">
<svg role="img" aria-label="{{ label }}" width="{{ size }}" height="{{ size }}" viewBox="{{ vb }}" style="display: block; overflow: visible;">
  <defs>
    <pattern id="ppScale" width="7" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 6 Q3.5 0 7 6 M-3.5 3 Q0 -3 3.5 3 M3.5 3 Q7 -3 10.5 3" fill="none" stroke="#1C3A0E" stroke-width="0.8"></path>
    </pattern>
    <radialGradient id="ppHead" cx="0.36" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#C6EE8C"></stop><stop offset="0.45" stop-color="#86BF47"></stop><stop offset="1" stop-color="#3E7420"></stop>
    </radialGradient>
    <radialGradient id="ppIris" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#FFF8B8"></stop><stop offset="0.55" stop-color="#E3C934"></stop><stop offset="1" stop-color="#8A6D0A"></stop>
    </radialGradient>
    <linearGradient id="ppLeaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2E7D32"></stop><stop offset="0.6" stop-color="#66BB6A"></stop><stop offset="1" stop-color="#B9E69A"></stop>
    </linearGradient>
    <filter id="ppBlur2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"></feGaussianBlur></filter>
    <filter id="ppBlur1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1"></feGaussianBlur></filter>
    <filter id="ppGround" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter>
  </defs>

  <ellipse cx="100" cy="184" rx="82" ry="9" fill="#14300C" opacity="0.4" filter="url(#ppGround)"></ellipse>

  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
    <g fill="none" stroke-linecap="round">
      <sc-for list="{{ g.lines }}" as="q" hint-placeholder-count="40"><line x1="{{ q.x1 }}" y1="{{ q.y1 }}" x2="{{ q.x2 }}" y2="{{ q.y2 }}" stroke="#1E4210" stroke-width="{{ q.w0 }}"></line></sc-for>
      <sc-for list="{{ g.lines }}" as="q" hint-placeholder-count="40"><line x1="{{ q.x1 }}" y1="{{ q.y1 }}" x2="{{ q.x2 }}" y2="{{ q.y2 }}" stroke="#4E8A24" stroke-width="{{ q.w }}"></line></sc-for>
      <sc-for list="{{ g.lines }}" as="q" hint-placeholder-count="40"><line x1="{{ q.x1 }}" y1="{{ q.y1 }}" x2="{{ q.x2 }}" y2="{{ q.y2 }}" stroke="#7DB843" stroke-width="{{ q.w1 }}"></line></sc-for>
      <g transform="translate(0 -2)" filter="url(#ppBlur1)" opacity="0.9">
        <sc-for list="{{ g.lines }}" as="q" hint-placeholder-count="40"><line x1="{{ q.x1 }}" y1="{{ q.y1 }}" x2="{{ q.x2 }}" y2="{{ q.y2 }}" stroke="#C5EC90" stroke-width="{{ q.w2 }}"></line></sc-for>
      </g>
      <sc-for list="{{ g.belly }}" as="q" hint-placeholder-count="0"><line x1="{{ q.x1 }}" y1="{{ q.y1 }}" x2="{{ q.x2 }}" y2="{{ q.y2 }}" stroke="#EEF3C2" stroke-width="{{ q.wb }}"></line></sc-for>
      <sc-for list="{{ g.scutes }}" as="q" hint-placeholder-count="0"><line x1="{{ q.x1 }}" y1="{{ q.y1 }}" x2="{{ q.x2 }}" y2="{{ q.y2 }}" stroke="#BFC77E" stroke-width="1" stroke-linecap="butt"></line></sc-for>
      <sc-for list="{{ g.spots }}" as="d" hint-placeholder-count="6"><ellipse cx="{{ d.cx }}" cy="{{ d.cy }}" rx="{{ d.rx }}" ry="{{ d.ry }}" fill="#2C5616" opacity="0.75"></ellipse></sc-for>
    </g>
  </sc-for>

  <g transform="{{ headT }}">
    <path d="M70 60 C 70 40, 84 28, 102 28 C 120 28, 138 40, 138 60 C 137 75, 121 83, 103 83 C 85 83, 70 76, 70 60 Z" transform="translate(-2 3)" fill="#0F2408" opacity="0.28" filter="url(#ppBlur2)"></path>
    <path d="M66 56 C 64 34, 82 22, 100 22 C 118 22, 136 34, 134 56 C 133 72, 118 80, 100 80 C 82 80, 67 72, 66 56 Z" fill="url(#ppHead)" stroke="#22451A" stroke-width="1.8"></path>
    <path d="M66 56 C 64 34, 82 22, 100 22 C 118 22, 136 34, 134 56 C 133 72, 118 80, 100 80 C 82 80, 67 72, 66 56 Z" fill="url(#ppScale)" opacity="0.1"></path>
    <path d="M78 70 C 88 79, 112 79, 122 70 C 114 76, 86 76, 78 70 Z" fill="#E6EFB8" opacity="0.9"></path>
    <ellipse cx="86" cy="31" rx="13" ry="5" transform="rotate(-14 86 31)" fill="#FFFFFF" opacity="0.5" filter="url(#ppBlur1)"></ellipse>
    <ellipse cx="76" cy="64" rx="5.5" ry="3.2" fill="#FF7F72" opacity="0.5" filter="url(#ppBlur1)"></ellipse>
    <ellipse cx="124" cy="64" rx="5.5" ry="3.2" fill="#FF7F72" opacity="0.5" filter="url(#ppBlur1)"></ellipse>

    <sc-if value="{{ awake }}" hint-placeholder-val="{{ true }}">
      <g>
        <path d="M75 40 Q86 33 97 39 M103 39 Q114 33 125 40" fill="none" stroke="#2C5616" stroke-width="2.2" stroke-linecap="round" opacity="0.7"></path>
        <circle cx="86" cy="50" r="10.5" fill="url(#ppIris)" stroke="#22451A" stroke-width="1.4"></circle>
        <circle cx="114" cy="50" r="10.5" fill="url(#ppIris)" stroke="#22451A" stroke-width="1.4"></circle>
        <ellipse cx="87" cy="51" rx="3.4" ry="7.2" fill="#0E140B"></ellipse>
        <ellipse cx="115" cy="51" rx="3.4" ry="7.2" fill="#0E140B"></ellipse>
        <circle cx="83" cy="46" r="3.2" fill="#FFFFFF"></circle><circle cx="111" cy="46" r="3.2" fill="#FFFFFF"></circle>
        <circle cx="90.5" cy="56" r="1.3" fill="#FFFFFF" opacity="0.9"></circle><circle cx="118.5" cy="56" r="1.3" fill="#FFFFFF" opacity="0.9"></circle>
        <path d="M90 70 Q100 77 110 70" fill="none" stroke="#1A2A12" stroke-width="1.9" stroke-linecap="round"></path>
        <path d="M100 74 C 100 79, 99.5 82, 98.5 85 M98.5 85 L95 89.5 M98.5 85 L100 90" fill="none" stroke="#8E1B1B" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M100 74 C 100 79, 99.5 82, 98.5 85 M98.5 85 L95 89.5 M98.5 85 L100 90" fill="none" stroke="#E5413A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
      </g>
    </sc-if>
    <sc-if value="{{ asleep }}" hint-placeholder-val="{{ false }}">
      <g fill="none" stroke="#1A2A12" stroke-linecap="round">
        <path d="M75 42 Q86 37 97 42 M103 42 Q114 37 125 42" stroke="#2C5616" stroke-width="2" opacity="0.6"></path>
        <path d="M77 50 Q86 58 95 50 M105 50 Q114 58 123 50" stroke-width="2.6"></path>
        <path d="M80 54.5 L77.5 58 M85 56.5 L84 60.5 M90 55.5 L91 59.5 M110 55.5 L109 59.5 M115 56.5 L116 60.5 M120 54.5 L122.5 58" stroke-width="1.5"></path>
        <path d="M95 71 Q100 74 105 71" stroke-width="1.8"></path>
      </g>
      <ellipse cx="111" cy="77" rx="3" ry="3.6" fill="#E3F6FF" stroke="#81D4FA" stroke-width="1" opacity="0.9"></ellipse>
    </sc-if>
    <ellipse cx="95" cy="63.5" rx="1.4" ry="1" fill="#1A2A12" opacity="0.8"></ellipse>
    <ellipse cx="105" cy="63.5" rx="1.4" ry="1" fill="#1A2A12" opacity="0.8"></ellipse>

    <path d="M104 30 C 104 12, 124 4, 140 8 C 134 24, 118 32, 104 30 Z" transform="translate(2 3)" fill="#0F2408" opacity="0.25" filter="url(#ppBlur1)"></path>
    <path d="M104 30 C 104 12, 124 4, 140 8 C 134 24, 118 32, 104 30 Z" fill="url(#ppLeaf)" stroke="#1F5A22" stroke-width="1.4" stroke-linejoin="round"></path>
    <path d="M106 29 Q122 18 138 9 M114 24 L113 16 M121 19 L121 11 M128 14 L129 8 M115 23 L123 24 M123 18 L131 18" fill="none" stroke="#DDF2C8" stroke-width="1" stroke-linecap="round" opacity="0.85"></path>
    <path d="M104 30 Q99 33 97 29" fill="none" stroke="#6D4C2A" stroke-width="2" stroke-linecap="round"></path>
  </g>

  <sc-if value="{{ asleep }}" hint-placeholder-val="{{ false }}">
    <g style="font-family: 'Fredoka', sans-serif; font-weight: 600;" fill="#FFFFFF" stroke="#3B5240" stroke-width="1" paint-order="stroke">
      <text x="146" y="78" font-size="17">z</text>
      <text x="158" y="60" font-size="23">z</text>
      <text x="172" y="38" font-size="29">Z</text>
    </g>
  </sc-if>
</svg>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pose":{"type":"enum","options":["stand","wave","sleep","coil","face"],"default":"stand"},"size":{"type":"number","default":200},"$preview":{"width":200,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const pose = this.props.pose || 'stand';
    const size = this.props.size || 200;
    const resting = pose === 'sleep' || pose === 'coil';
    // Body: a tapered spiral coil seen from the front. Inner loops sit higher, so drawing the
    // half-loops in tail-to-centre order already stacks them correctly.
    const cx = 100, cy = 160, squash = 0.42, R0 = 68, Rin = 34, lift = 26;
    const T = 1.75 * 2 * Math.PI, N = 160;
    const pts = [];
    for (let i = 0; i <= N; i++) {
      const k = i / N, phi = k * T;
      const r = R0 - (R0 - Rin) * k;
      pts.push({ x: cx + r * Math.cos(phi), y: cy - lift * k + r * squash * Math.sin(phi), w: 9 + 17 * Math.pow(k, 0.6), front: Math.sin(phi) > 0 });
    }
    const runs = [];
    let cur = null;
    pts.forEach((p) => {
      if (!cur || cur.front !== p.front) { if (cur) cur.pts.push(p); cur = { front: p.front, pts: [] }; runs.push(cur); }
      cur.pts.push(p);
    });
    const end = pts[pts.length - 1];
    const neck = [];
    if (!resting && pose !== 'face') {
      const hx = 100, hy = 74;
      for (let i = 0; i <= 30; i++) {
        const u = i / 30, a = (1 - u) ** 3, b = 3 * (1 - u) ** 2 * u, c = 3 * (1 - u) * u * u, d = u ** 3;
        neck.push({ x: a * end.x + b * (end.x + 10) + c * (hx - 18) + d * hx, y: a * end.y + b * (end.y - 30) + c * (hy + 26) + d * hy, w: 24 - 2 * u });
      }
    }
    const f = (n) => n.toFixed(1);
    const toLines = (arr) => {
      const out = [];
      for (let i = 0; i < arr.length - 1; i++) {
        const p = arr[i], q = arr[i + 1], w = (p.w + q.w) / 2;
        out.push({ i, x1: f(p.x), y1: f(p.y), x2: f(q.x), y2: f(q.y), w: f(w), w0: f(w + 3), w1: f(w * 0.72), w2: f(w * 0.3), wb: f(w * 0.5), hw: w });
      }
      return out;
    };
    const groups = runs.map((r) => {
      const lines = toLines(r.pts);
      return { lines, belly: [], scutes: [], spots: lines.filter((q) => q.i % 6 === 3).map((q) => ({ cx: q.x1, cy: f(+q.y1 - q.hw * 0.12), rx: f(q.hw * 0.22), ry: f(q.hw * 0.14) })) };
    });
    if (neck.length) {
      const lines = toLines(neck);
      groups.push({ lines, spots: [], belly: lines,
        scutes: lines.filter((q) => q.i % 3 === 0).map((q) => ({ x1: f(+q.x1 - q.hw * 0.24), y1: q.y1, x2: f(+q.x1 + q.hw * 0.24), y2: q.y1 })) });
    }
    const labels = { stand: 'Pip, a baby green snake wearing a leaf hat', wave: 'Pip, a baby green snake wearing a leaf hat', sleep: 'Pip asleep on its coil', coil: 'Pip resting on its coil', face: 'Pip' };
    return {
      groups: pose === 'face' ? [] : groups, size,
      vb: pose === 'face' ? '60 2 86 86' : '0 0 200 200',
      headT: resting ? 'translate(98 116) scale(0.86) rotate(-7) translate(-100 -52)' : '',
      awake: pose !== 'sleep',
      asleep: pose === 'sleep',
      label: labels[pose] || 'Pip',
      use3d: pose !== 'face', useSvg: pose === 'face',
      src: pose === 'sleep' ? '/_blob/c704ec2a46a984033f905fb1e7353a7b' : '/_blob/cb80f7c297e4e249a58c69590cd3bd1d'
    };
  }
}
</script>
</body>
</html>
