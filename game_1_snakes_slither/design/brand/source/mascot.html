    g.fillStyle = a; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(200,240,150,0.55)'; g.lineWidth = 4; g.beginPath(); g.moveTo(w / 2, h); g.lineTo(w / 2, 0); g.stroke();
    g.lineWidth = 2; g.strokeStyle = 'rgba(200,240,150,0.18)';
    for (let k = 1; k < 10; k++) { const y = h - k * h / 10; g.beginPath(); g.moveTo(w / 2, y); g.quadraticCurveTo(w * 0.75, y - 20, w, y - 50); g.stroke(); g.beginPath(); g.moveTo(w / 2, y); g.quadraticCurveTo(w * 0.25, y - 20, 0, y - 50); g.stroke(); }
  });
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, (p.getX(i) / wid + 1) / 2, 1 - p.getY(i) / len);
  return new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({ map: tex, side: THREE.DoubleSide, roughness: 0.55, clearcoat: 0.35, clearcoatRoughness: 0.35, envMapIntensity: 0.4 }));
}
if (LEAVES) {
  // [angle around the base (0 = toward camera), length, elevation, radius]
  const spots = [
    [1.45, 1.9, 0.42, 1.95], [1.9, 2.1, 0.55, 1.85], [2.4, 2.0, 0.62, 1.75], [2.85, 2.1, 0.7, 1.65],
    [-1.45, 1.9, 0.42, 1.95], [-1.9, 2.1, 0.55, 1.85], [-2.4, 2.0, 0.62, 1.75], [-2.85, 2.1, 0.7, 1.65],
    [3.14, 2.2, 0.72, 1.6], [1.0, 1.4, 0.3, 2.0], [-1.0, 1.4, 0.3, 2.0]
  ];
  spots.forEach(([ang, len, el, rad], i) => {
    const L = leaf(len, len * 0.34, i % 3 === 0 ? '#3E9B3A' : i % 3 === 1 ? '#2C7F30' : '#47A33C');
    const g = new THREE.Group();
    g.position.set(Math.sin(ang) * rad, -0.05, Math.cos(ang) * rad);
    g.rotation.y = ang;
    L.rotation.x = Math.PI / 2 - el;
    L.rotation.y = (i % 2 ? 0.25 : -0.25);
    L.castShadow = true; L.receiveShadow = true;
    g.add(L); root.add(g);
  });
}

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight('#FFFDF0', '#24461F', 0.6));
const key = new THREE.DirectionalLight('#FFF3DC', 2.5);
key.position.set(-5, 8, 6); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 });
key.shadow.radius = 8; key.shadow.bias = -0.0003; key.shadow.normalBias = 0.02;
scene.add(key);
const rim = new THREE.DirectionalLight('#F2FFC8', 1.8); rim.position.set(4, 5, -6); scene.add(rim);
const fill = new THREE.DirectionalLight('#DDEBFF', 0.55); fill.position.set(6, 2, 5); scene.add(fill);

// ---------- Camera ----------
const aspect = W / H;
const cam = new THREE.PerspectiveCamera(+(P.get('fov') || 27), aspect, 0.1, 100);
cam.position.copy(camPos);
cam.lookAt(0, +(P.get('ty') || 1.05), 0);
renderer.render(scene, cam);
window.__done = true;
</script>
