<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:CD;src:url(node_modules/@fontsource/cinzel-decorative/files/cinzel-decorative-latin-900-normal.woff2)}
@font-face{font-family:CZ;font-weight:800;src:url(node_modules/@fontsource/cinzel/files/cinzel-latin-800-normal.woff2)}
html,body{margin:0;background:transparent}
#logo{width:1600px;height:1360px;position:relative}
svg{position:absolute;inset:0}
</style></head><body>
<div id="logo">
<svg width="1600" height="1360" viewBox="0 0 1600 1360">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF7D1"/><stop offset=".22" stop-color="#F6D77A"/><stop offset=".45" stop-color="#D6A83F"/>
    <stop offset=".55" stop-color="#9E6B14"/><stop offset=".72" stop-color="#E9C45E"/><stop offset="1" stop-color="#8A5A10"/>
  </linearGradient>
  <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFF3C0"/><stop offset=".3" stop-color="#E8BE55"/><stop offset=".5" stop-color="#A8731A"/>
    <stop offset=".7" stop-color="#F3D27A"/><stop offset="1" stop-color="#8E5C12"/>
  </linearGradient>
  <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFBE6"/><stop offset=".18" stop-color="#FCE38F"/><stop offset=".42" stop-color="#E2B04A"/>
    <stop offset=".5" stop-color="#A06A12"/><stop offset=".62" stop-color="#D9A43C"/><stop offset=".85" stop-color="#F7D879"/><stop offset="1" stop-color="#B5801F"/>
  </linearGradient>
  <radialGradient id="velvet" cx=".5" cy=".38" r=".7">
    <stop offset="0" stop-color="#3FA466"/><stop offset=".45" stop-color="#1D6B3E"/><stop offset="1" stop-color="#082A18"/>
  </radialGradient>
  <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2F8F55"/><stop offset=".5" stop-color="#17603A"/><stop offset="1" stop-color="#0A3A22"/>
  </linearGradient>
  <linearGradient id="ribbonBack" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#145232"/><stop offset="1" stop-color="#062615"/>
  </linearGradient>
  <radialGradient id="gem" cx=".35" cy=".3" r=".8">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".25" stop-color="#7CF2A8"/><stop offset=".6" stop-color="#119A4E"/><stop offset="1" stop-color="#03401F"/>
  </radialGradient>
  <radialGradient id="ruby" cx=".35" cy=".3" r=".8">
    <stop offset="0" stop-color="#FFE3E3"/><stop offset=".3" stop-color="#FF5A5A"/><stop offset=".7" stop-color="#A3101E"/><stop offset="1" stop-color="#4A0008"/>
  </radialGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#FFE9A6" stop-opacity=".55"/><stop offset=".6" stop-color="#F2C14E" stop-opacity=".15"/><stop offset="1" stop-color="#F2C14E" stop-opacity="0"/>
  </radialGradient>
  <filter id="bevel" x="-10%" y="-10%" width="120%" height="130%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
    <feSpecularLighting in="b" surfaceScale="5" specularConstant="1.1" specularExponent="22" lighting-color="#FFF8DC" result="s">
      <feDistantLight azimuth="235" elevation="48"/>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
    <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".75" k4="0"/>
  </filter>
  <filter id="drop" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#02160B" flood-opacity=".55"/>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="medClip"><circle cx="800" cy="470" r="222"/></clipPath>
  <path id="leaf" d="M0 0 C 14 -10, 34 -10, 46 0 C 34 10, 14 10, 0 0 Z"/>
  <g id="branch">
    <path d="M0 0 C 70 -40, 170 -62, 310 -46" fill="none" stroke="url(#goldH)" stroke-width="8" stroke-linecap="round"/>
    <use href="#leaf" transform="translate(40 -22) rotate(-72) scale(1.35)" fill="url(#goldH)"/><use href="#leaf" transform="translate(48 -25) rotate(14) scale(1.3)" fill="url(#goldH)"/><use href="#leaf" transform="translate(95 -44) rotate(-69) scale(1.3)" fill="url(#goldH)"/><use href="#leaf" transform="translate(103 -47) rotate(10) scale(1.25)" fill="url(#goldH)"/><use href="#leaf" transform="translate(152 -55) rotate(-66) scale(1.25)" fill="url(#goldH)"/><use href="#leaf" transform="translate(160 -58) rotate(6) scale(1.2)" fill="url(#goldH)"/><use href="#leaf" transform="translate(210 -56) rotate(-63) scale(1.2000000000000002)" fill="url(#goldH)"/><use href="#leaf" transform="translate(218 -59) rotate(2) scale(1.15)" fill="url(#goldH)"/><use href="#leaf" transform="translate(265 -50) rotate(-60) scale(1.1500000000000001)" fill="url(#goldH)"/><use href="#leaf" transform="translate(273 -53) rotate(-2) scale(1.1)" fill="url(#goldH)"/><use href="#leaf" transform="translate(300 -46) rotate(-20) scale(1.15)" fill="url(#goldH)"/>
  </g>
</defs>

<!-- halo + sunburst -->
<circle cx="800" cy="470" r="420" fill="url(#glow)"/>
<g opacity=".35" stroke="url(#goldH)" stroke-width="5" stroke-linecap="round">
  <g id="rays"></g>
</g>

<!-- laurel wreath (gold) -->
<g filter="url(#drop)">
  <g transform="translate(700 730) rotate(-128)"><use href="#branch" filter="url(#bevel)"/></g>
  <g transform="translate(900 730) scale(-1 1) rotate(-128)"><use href="#branch" filter="url(#bevel)"/></g>
</g>

<!-- medallion -->
<g filter="url(#drop)">
  <circle cx="800" cy="470" r="262" fill="url(#goldH)" filter="url(#bevel)"/>
  <circle cx="800" cy="470" r="244" fill="#5C3A0A"/>
  <circle cx="800" cy="470" r="238" fill="url(#gold)" filter="url(#bevel)"/>
  <circle cx="800" cy="470" r="222" fill="url(#velvet)"/>
</g>
<g id="beads"></g>
<g clip-path="url(#medClip)">
  <circle cx="800" cy="300" r="260" fill="#FFFFFF" opacity=".07"/>
  <g opacity=".14" fill="#BFF5CF"><g id="scales"></g></g>
  <ellipse cx="800" cy="640" rx="190" ry="40" fill="#02160B" opacity=".55" filter="url(#soft)"/>
</g>
<circle cx="800" cy="470" r="222" fill="none" stroke="#FCE38F" stroke-width="2" opacity=".7"/>

<!-- Pip: coil inside, head breaks the frame -->
<image href="../renders/hero_plain_cropped.png" x="598" y="168" width="404" height="502" filter="url(#drop)"/>

<!-- crown gem on top of the medallion -->


<!-- SNAKE wordmark -->
<g filter="url(#drop)" font-family="CD" font-size="236" text-anchor="middle" letter-spacing="6">
  <text x="800" y="925" fill="none" stroke="#0A2E1B" stroke-width="34" stroke-linejoin="round">SNAKE</text>
  <text x="800" y="925" fill="none" stroke="url(#goldH)" stroke-width="18" stroke-linejoin="round" filter="url(#bevel)">SNAKE</text>
  <text x="800" y="925" fill="none" stroke="#3B2405" stroke-width="7" stroke-linejoin="round">SNAKE</text>
  <text x="800" y="925" fill="url(#goldText)" filter="url(#bevel)">SNAKE</text>
  <text x="800" y="925" fill="#FFFFFF" opacity=".18" clip-path="url(#topHalf)">SNAKE</text>
</g>

<!-- SLITHER ribbon -->
<g filter="url(#drop)">
  <path d="M352 1000 L440 990 L440 1110 L352 1120 L392 1060 Z" fill="url(#ribbonBack)" stroke="url(#goldH)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M1248 1000 L1160 990 L1160 1110 L1248 1120 L1208 1060 Z" fill="url(#ribbonBack)" stroke="url(#goldH)" stroke-width="6" stroke-linejoin="round"/>
  <path d="M440 990 L478 1012 L478 1124 L440 1110Z" fill="#041A0E"/>
  <path d="M1160 990 L1122 1012 L1122 1124 L1160 1110Z" fill="#041A0E"/>
  <path d="M470 968 Q800 1010 1130 968 L1130 1092 Q800 1134 470 1092 Z" fill="url(#ribbon)"/>
  <path d="M470 968 Q800 1010 1130 968 L1130 1092 Q800 1134 470 1092 Z" fill="none" stroke="url(#goldH)" stroke-width="9" filter="url(#bevel)"/>
  <path d="M490 986 Q800 1026 1110 986" fill="none" stroke="#FCE38F" stroke-width="2.5" opacity=".75"/>
  <path d="M490 1076 Q800 1116 1110 1076" fill="none" stroke="#FCE38F" stroke-width="2.5" opacity=".75"/>
</g>
<path id="ribbonText" d="M500 1058 Q800 1098 1100 1058" fill="none"/>
<g font-family="CZ" font-weight="800" font-size="92" letter-spacing="22" text-anchor="middle">
  <text fill="#041A0E" opacity=".6" transform="translate(0 5)"><textPath href="#ribbonText" startOffset="50%">SLITHER</textPath></text>
  <text fill="url(#goldText)" filter="url(#bevel)"><textPath href="#ribbonText" startOffset="50%">SLITHER</textPath></text>
</g>

<!-- jewels -->
<g filter="url(#drop)">
  <circle cx="800" cy="1150" r="0"/>
  <g transform="translate(800 742)"><circle r="30" fill="url(#gold)" filter="url(#bevel)"/><circle r="20" fill="url(#ruby)"/><circle cx="-7" cy="-8" r="5" fill="#fff" opacity=".85"/></g>
</g>
<g id="sparkles" fill="#FFF8DC"></g>
<defs><clipPath id="topHalf"><rect x="0" y="700" width="1600" height="150"/></clipPath></defs>
</svg>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const rays=document.getElementById('rays');
for(let i=0;i<36;i++){const a=i*10*Math.PI/180;const l=document.createElementNS(NS,'line');
 l.setAttribute('x1',800+Math.cos(a)*300);l.setAttribute('y1',470+Math.sin(a)*300);
 l.setAttribute('x2',800+Math.cos(a)*(i%2?360:400));l.setAttribute('y2',470+Math.sin(a)*(i%2?360:400));rays.appendChild(l);}
const beads=document.getElementById('beads');
for(let i=0;i<40;i++){const a=i*9*Math.PI/180;const c=document.createElementNS(NS,'circle');
 c.setAttribute('cx',800+Math.cos(a)*253);c.setAttribute('cy',470+Math.sin(a)*253);c.setAttribute('r',5.5);
 c.setAttribute('fill','#FFF2B8');c.setAttribute('opacity','.9');beads.appendChild(c);}
const sc=document.getElementById('scales');
for(let y=260;y<700;y+=30)for(let x=560;x<1050;x+=34){const p=document.createElementNS(NS,'path');const ox=(y/30)%2?17:0;
 p.setAttribute('d',`M${x+ox} ${y} q17 22 34 0`);p.setAttribute('fill','none');p.setAttribute('stroke','#BFF5CF');p.setAttribute('stroke-width','2');sc.appendChild(p);}
const sp=document.getElementById('sparkles');
for(const [x,y,s] of [[1090,770,1.2],[505,800,.9],[1180,300,.8],[420,330,1],[1015,180,.7],[600,1170,.8]]){
 const p=document.createElementNS(NS,'path');p.setAttribute('d','M0 -22 L5 -5 L22 0 L5 5 L0 22 L-5 5 L-22 0 L-5 -5Z');
 p.setAttribute('transform',`translate(${x} ${y}) scale(${s})`);sp.appendChild(p);}
</script>
</body></html>
