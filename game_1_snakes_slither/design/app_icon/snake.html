<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const P = new URLSearchParams(location.search);
const SIZE = +(P.get('size') || 2048);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: false });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.82;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

// Background: deep forest green with a soft glow behind the snake.
scene.background = canvasTex(1024, 1024, (g) => {
  const a = g.createRadialGradient(512, 430, 30, 512, 520, 760);
  a.addColorStop(0, '#2F7546'); a.addColorStop(0.35, '#1B4D2E'); a.addColorStop(0.75, '#0E2E1B'); a.addColorStop(1, '#071A0F');
  g.fillStyle = a; g.fillRect(0, 0, 1024, 1024);
});

// ---------- Snake path: a coil resting on the grass, then a raised S-curved neck ----------
const pts = [];
const turns = 1.6, N = 90;
for (let i = 0; i <= N; i++) {
  const k = i / N;
  const ang = -Math.PI * 0.55 + k * turns * Math.PI * 2;
  const r = 1.72 - 0.92 * k;
  pts.push(new THREE.Vector3(Math.cos(ang) * r, 0.30 + k * 0.36, Math.sin(ang) * r));
}
const end = pts[pts.length - 1];
const neckCtrl = [
  new THREE.Vector3(end.x + 0.18, end.y + 0.55, end.z + 0.05),
  new THREE.Vector3(end.x - 0.05, end.y + 1.15, end.z + 0.35),
  new THREE.Vector3(0.05, 2.15, 0.55)
];
neckCtrl.forEach((p) => pts.push(p));
const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);

const TS = 520, RS = 48;
const tube = new THREE.TubeGeometry(curve, TS, 1, RS, false);
// Taper: thin tail, thick middle, slimmer neck below the head.
const radiusAt = (u) => {
  const tail = THREE.MathUtils.smoothstep(u, 0, 0.32);
  const neck = 1 - 0.18 * THREE.MathUtils.smoothstep(u, 0.78, 0.97);
  return 0.035 + 0.30 * Math.pow(tail, 0.9) * neck;
};
{
  const pos = tube.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i <= TS; i++) {
    const u = i / TS, c = curve.getPointAt(u), r = radiusAt(u);
    for (let j = 0; j <= RS; j++) {
      const idx = i * (RS + 1) + j;
      v.fromBufferAttribute(pos, idx).sub(c).multiplyScalar(r).add(c);
      pos.setXYZ(idx, v.x, v.y, v.z);
    }
  }
  tube.computeVertexNormals();
}

// Scale texture: emerald body, darker diamond saddles along the back, fine scale outlines.
const LEN_REPEAT = 46;
const skin = canvasTex(512, 512, (g, w, h) => {
  const grd = g.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, '#1F6E2A'); grd.addColorStop(0.25, '#2F8A34'); grd.addColorStop(0.5, '#56A83E'); grd.addColorStop(0.75, '#2F8A34'); grd.addColorStop(1, '#1F6E2A');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
  // dorsal saddles (top of the tube is v≈0 / 1 depending on frame; draw on both edges)
  g.fillStyle = 'rgba(12,50,18,0.35)';
  [[0, 1], [h, -1]].forEach(([y0, s]) => { g.beginPath(); g.moveTo(w * 0.15, y0); g.lineTo(w * 0.5, y0 + s * h * 0.16); g.lineTo(w * 0.85, y0); g.closePath(); g.fill(); });
  // scale grid
  g.strokeStyle = 'rgba(10,40,12,0.4)'; g.lineWidth = 2;
  const sx = w / 4, sy = h / 12;
  for (let row = 0; row <= 12; row++) for (let col = -1; col <= 4; col++) {
    const x = col * sx + (row % 2 ? sx / 2 : 0), y = row * sy;
    g.beginPath(); g.ellipse(x, y, sx * 0.52, sy * 0.62, 0, 0, Math.PI); g.stroke();
  }
});
skin.wrapS = skin.wrapT = THREE.RepeatWrapping; skin.repeat.set(LEN_REPEAT, 1);
const bump = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  const sx = w / 4, sy = h / 12;
  for (let row = 0; row <= 12; row++) for (let col = -1; col <= 4; col++) {
    const x = col * sx + (row % 2 ? sx / 2 : 0), y = row * sy;
    const rg = g.createRadialGradient(x, y + sy * 0.15, 2, x, y, sx * 0.55);
    rg.addColorStop(0, '#C8C8C8'); rg.addColorStop(1, '#5A5A5A');
    g.fillStyle = rg; g.beginPath(); g.ellipse(x, y, sx * 0.5, sy * 0.6, 0, 0, Math.PI * 2); g.fill();
  }
}, false);
bump.wrapS = bump.wrapT = THREE.RepeatWrapping; bump.repeat.set(LEN_REPEAT, 1);

const skinMat = new THREE.MeshPhysicalMaterial({
  map: skin, bumpMap: bump, bumpScale: 1.2, roughness: 0.38, metalness: 0.0,
  clearcoat: 0.9, clearcoatRoughness: 0.22, sheen: 0.3, sheenColor: new THREE.Color('#D8FF9E'), envMapIntensity: 0.55
});
const body = new THREE.Mesh(tube, skinMat); body.castShadow = true; body.receiveShadow = true;
scene.add(body);

// ---------- Head ----------
const headPos = curve.getPointAt(1);
const tan = curve.getTangentAt(1).normalize();
const head = new THREE.Group();
head.position.copy(headPos).add(tan.clone().multiplyScalar(0.12));
scene.add(head);
// orient: forward = toward the camera-ish, slightly down
const look = new THREE.Vector3(0.0, 3.6, 9.0);
head.lookAt(look);
head.scale.setScalar(1.22);
const headMat = skinMat.clone(); headMat.map = skin.clone(); headMat.map.repeat.set(3, 1); headMat.bumpMap = bump.clone(); headMat.bumpMap.repeat.set(3, 1); headMat.bumpScale = 0.6;
const skull = new THREE.Mesh(new THREE.SphereGeometry(0.42, 64, 48), headMat);
skull.scale.set(1.18, 0.84, 1.15); skull.position.set(0, 0.04, 0.05);
skull.castShadow = true; head.add(skull);
const snout = new THREE.Mesh(new THREE.SphereGeometry(0.34, 64, 48), headMat);
snout.scale.set(1.0, 0.66, 1.0); snout.position.set(0, -0.05, 0.3); snout.castShadow = true; head.add(snout);
// lighter jaw
const jawMat = new THREE.MeshPhysicalMaterial({ color: '#B9D77E', roughness: 0.45, clearcoat: 0.6, clearcoatRoughness: 0.3 });
const jaw = new THREE.Mesh(new THREE.SphereGeometry(0.3, 48, 32), jawMat);
jaw.scale.set(1.15, 0.4, 1.05); jaw.position.set(0, -0.2, 0.22); head.add(jaw);
// eyes: amber iris, vertical pupil, glossy cornea
const eyeWhite = new THREE.MeshPhysicalMaterial({ color: '#F4D35E', roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.05 });
const pupilMat = new THREE.MeshStandardMaterial({ color: '#0D1408', roughness: 0.3 });
const corneaMat = new THREE.MeshPhysicalMaterial({ color: '#FFFFFF', transparent: true, opacity: 0.18, roughness: 0.02, clearcoat: 1, transmission: 0 });
[-1, 1].forEach((s) => {
  const eg = new THREE.Group(); eg.position.set(s * 0.25, 0.15, 0.33); eg.rotation.y = s * 0.3; head.add(eg);
  const ridge = new THREE.Mesh(new THREE.SphereGeometry(0.15, 32, 24), headMat); ridge.scale.set(1.25, 0.6, 0.9); ridge.position.set(0, 0.1, -0.03); eg.add(ridge);
  const iris = new THREE.Mesh(new THREE.SphereGeometry(0.14, 48, 32), eyeWhite); eg.add(iris);
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.05, 32, 24), pupilMat); pupil.scale.set(0.5, 1.45, 0.55); pupil.position.set(0, 0, 0.115); eg.add(pupil);
  const glint = new THREE.Mesh(new THREE.SphereGeometry(0.022, 16, 12), new THREE.MeshBasicMaterial({ color: '#FFFFFF' })); glint.position.set(-0.045, 0.055, 0.128); eg.add(glint);
  const cornea = new THREE.Mesh(new THREE.SphereGeometry(0.145, 32, 24), corneaMat); eg.add(cornea);
});
// nostrils
[-1, 1].forEach((s) => {
  const n = new THREE.Mesh(new THREE.SphereGeometry(0.022, 12, 8), pupilMat); n.position.set(s * 0.09, 0.04, 0.6); head.add(n);
});
// gentle smile line
{
  const smile = new THREE.CatmullRomCurve3([new THREE.Vector3(-0.27, -0.1, 0.36), new THREE.Vector3(0, -0.15, 0.58), new THREE.Vector3(0.27, -0.1, 0.36)]);
  const m = new THREE.Mesh(new THREE.TubeGeometry(smile, 40, 0.012, 8, false), new THREE.MeshStandardMaterial({ color: '#1F4A14', roughness: 0.6 }));
  head.add(m);
}

// ---------- Grass island ----------
const islandR = 2.1, islandH = 0.55;
const grassTop = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#2F6E2A'; g.fillRect(0, 0, w, h);
  let s = 11; const r = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  for (let i = 0; i < 9000; i++) {
    const x = r() * w, y = r() * h, l = 4 + r() * 10;
    g.strokeStyle = r() > 0.5 ? 'rgba(96,160,64,0.6)' : 'rgba(20,70,24,0.6)';
    g.lineWidth = 1.5; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (r() - 0.5) * 3, y - l); g.stroke();
  }
});
const soil = canvasTex(1024, 256, (g, w, h) => {
  const a = g.createLinearGradient(0, 0, 0, h);
  a.addColorStop(0, '#3F7F32'); a.addColorStop(0.18, '#3A6E2C'); a.addColorStop(0.24, '#6B4A2E'); a.addColorStop(1, '#3E2A18');
  g.fillStyle = a; g.fillRect(0, 0, w, h);
  let s = 5; const r = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  for (let i = 0; i < 500; i++) { g.fillStyle = `rgba(30,18,8,${0.15 + r() * 0.25})`; g.beginPath(); g.ellipse(r() * w, h * 0.3 + r() * h * 0.7, 2 + r() * 6, 1 + r() * 3, 0, 0, Math.PI * 2); g.fill(); }
});
{
  const topMat = new THREE.MeshStandardMaterial({ map: grassTop, roughness: 0.92, envMapIntensity: 0.6 });
  const sideMat = new THREE.MeshStandardMaterial({ map: soil, roughness: 0.95, envMapIntensity: 0.4 });
  const geo = new THREE.CylinderGeometry(islandR, islandR * 0.82, islandH, 128, 1, false);
  const island = new THREE.Mesh(geo, [sideMat, topMat, sideMat]);
  island.position.y = -islandH / 2; island.receiveShadow = true; island.castShadow = true;
  scene.add(island);
  // soft grass lip
  const lip = new THREE.Mesh(new THREE.TorusGeometry(islandR - 0.02, 0.07, 16, 160), new THREE.MeshStandardMaterial({ color: '#2F6E2A', roughness: 0.9 }));
  lip.rotation.x = Math.PI / 2; lip.position.y = -0.04; lip.scale.set(1, 1, 0.6); lip.receiveShadow = true; scene.add(lip);
  // a few grass tufts on the rim
  const bladeMat = new THREE.MeshStandardMaterial({ color: '#3F8A34', roughness: 0.8, side: THREE.DoubleSide });
  const tufts = [[-1.85, 0.8], [-1.35, 1.45], [1.75, 1.05], [1.95, -0.45], [-1.95, -0.55], [0.5, 1.95]];
  tufts.forEach(([x, z], ti) => {
    for (let b = 0; b < 7; b++) {
      const bl = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.32 + (b % 3) * 0.08, 5), bladeMat);
      const a = (b / 7) * Math.PI * 2;
      bl.position.set(x + Math.cos(a) * 0.06, 0.14, z + Math.sin(a) * 0.06);
      bl.rotation.set(Math.cos(a) * 0.35, 0, Math.sin(a) * 0.35);
      bl.castShadow = true; scene.add(bl);
    }
  });
}
// contact shadow on the grass under the coil
{
  const t = canvasTex(256, 256, (g) => {
    const a = g.createRadialGradient(128, 128, 10, 128, 128, 128);
    a.addColorStop(0, 'rgba(0,0,0,0.55)'); a.addColorStop(0.6, 'rgba(0,0,0,0.25)'); a.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = a; g.fillRect(0, 0, 256, 256);
  }, false);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 4.2), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false, opacity: 0.7 }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.004; scene.add(m);
}

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight('#F3FFE8', '#14301C', 0.35));
const key = new THREE.DirectionalLight('#FFF1D8', 2.6);
key.position.set(-5, 8, 5); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 });
key.shadow.radius = 8; key.shadow.bias = -0.0003; key.shadow.normalBias = 0.02;
scene.add(key);
const rim = new THREE.DirectionalLight('#E8FFB8', 2.2); rim.position.set(3, 4, -6); scene.add(rim);
const fill = new THREE.DirectionalLight('#CFE6FF', 0.45); fill.position.set(6, 2, 4); scene.add(fill);

// ---------- Camera ----------
const cam = new THREE.PerspectiveCamera(25, 1, 0.1, 100);
cam.position.set(0.0, 3.7, 10.5);
cam.lookAt(0, 1.0, 0);
renderer.render(scene, cam);
window.__done = true;
</script>
</body>
