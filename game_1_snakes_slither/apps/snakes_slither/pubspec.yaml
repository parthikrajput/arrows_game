  equatable: ^3.0.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  google_fonts: ^9.0.0
  audioplayers: ^6.8.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
